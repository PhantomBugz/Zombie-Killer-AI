[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "zombie-killer-sdk"
version = "0.1.0a1"
description = "Dependency-free lifecycle broadcaster for Zombie Killer"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "PhantomBugz" }]
keywords = ["agents", "lifecycle", "observability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://PhantomBugz.com"
Documentation = "https://github.com/PhantomBugz/Zombie-Killer-AI#readme"
Source = "https://github.com/PhantomBugz/Zombie-Killer-AI"
Issues = "https://github.com/PhantomBugz/Zombie-Killer-AI/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/zombie_killer"]


[tool.pytest.ini_options]
testpaths = ["tests"]
