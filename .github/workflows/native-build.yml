name: Native build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Unsigned native verification on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Linux WebView prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Use pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Use Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Use pinned Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install exact dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          python -m pip install uv==0.12.3
          uv sync --frozen
          pnpm install --frozen-lockfile
      - name: Run full Windows source release gate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ZK_DISPOSABLE_WINDOWS_PROFILE: '1'
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Full Windows verification requires a disposable GitHub-hosted runner.' }
          pnpm verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Rust
        if: runner.os != 'Windows'
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
          cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Verify portable launcher Rust
        if: runner.os != 'Windows'
        run: |
          cargo fmt --manifest-path tools/portable-launcher/Cargo.toml --check
          cargo clippy --locked --manifest-path tools/portable-launcher/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path tools/portable-launcher/Cargo.toml
      - name: Verify Unix recovery harness
        if: runner.os != 'Windows'
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/build_support/unix-test-harness/Cargo.toml --check
          cargo clippy --locked --manifest-path apps/desktop/src-tauri/build_support/unix-test-harness/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path apps/desktop/src-tauri/build_support/unix-test-harness/Cargo.toml
      - name: Build unsigned native executable
        if: runner.os != 'Windows'
        run: pnpm --filter @zombie-killer/desktop tauri build --no-bundle '--' --locked
      - name: Package complete unsigned native verification archive
        if: runner.os != 'Windows'
        run: uv run --frozen python -I scripts/package-native-artifact.py
      - name: Package verified Windows native artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Windows artifact packaging requires a disposable GitHub-hosted runner.' }
          $native = 'apps/desktop/src-tauri/target/release/zombie-killer.exe'
          $manifest = 'apps/desktop/src-tauri/resources/engine/BUILD-MANIFEST.json'
          if (-not (Test-Path -LiteralPath $native -PathType Leaf) -or -not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
            throw 'Full source verification did not leave a native EXE and sealed engine manifest.'
          }
          uv run --frozen python -I scripts/package-native-artifact.py --output-dir artifacts/native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = @(Get-ChildItem -LiteralPath artifacts/native -Filter '*.zip' -File)
          if ($archive.Count -ne 1) { throw 'Expected exactly one verified Windows native ZIP.' }
          $expectedLine = "$((Get-FileHash -LiteralPath $archive[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($archive[0].Name)"
          $checksums = @(Get-Content -LiteralPath 'artifacts/native/SHA256SUMS')
          if ($checksums -cnotcontains $expectedLine) { throw 'Windows native ZIP does not match SHA256SUMS.' }
      - name: Verify portable builder and smoke helpers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv run --frozen pytest -p no:cacheprovider scripts/tests/test_portable_exe.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/tests/native-smoke.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/tests/portable-smoke.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test the extracted Windows native archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ZK_DISPOSABLE_WINDOWS_PROFILE: '1'
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Extracted ZIP smoke requires a disposable GitHub-hosted Windows runner.' }
          $archive = @(Get-ChildItem -LiteralPath artifacts/native -Filter '*.zip' -File)
          if ($archive.Count -ne 1) { throw 'Expected exactly one native verification archive.' }
          $extracted = Join-Path $env:RUNNER_TEMP ('zombie-killer-native-' + [guid]::NewGuid().ToString('D'))
          New-Item -ItemType Directory -Path $extracted | Out-Null
          Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath $extracted
          foreach ($required in @('Start Zombie Killer.cmd', 'target/release/zombie-killer.exe', 'target/release/engine/BUILD-MANIFEST.json', 'target/release/.cargo-lock')) {
            if (-not (Test-Path -LiteralPath (Join-Path $extracted $required) -PathType Leaf)) { throw "Extracted ZIP is missing $required." }
          }
          pwsh -NoProfile -File scripts/native-smoke.ps1 -ExecutablePath (Join-Path $extracted 'target/release/zombie-killer.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify unsigned portable Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ZK_DISPOSABLE_WINDOWS_PROFILE: '1'
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Portable smoke requires a disposable GitHub-hosted Windows runner.' }
          $archive = @(Get-ChildItem -LiteralPath artifacts/native -Filter '*.zip' -File)
          if ($archive.Count -ne 1) { throw 'Expected exactly one native verification archive.' }
          $portableOutput = 'artifacts/portable'
          $buildOutput = @(uv run --frozen python -I scripts/build-portable-exe.py --archive $archive[0].FullName --output-dir $portableOutput)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($buildOutput.Count -lt 1) { throw 'Portable builder returned no artifact summary.' }
          $build = $buildOutput[-1] | ConvertFrom-Json -AsHashtable
          if ([string]$build['sha256'] -cnotmatch '^[0-9a-f]{64}$' -or [string]$build['payload_sha256'] -cnotmatch '^[0-9a-f]{64}$') {
            throw 'Portable builder returned invalid artifact hashes.'
          }
          $executable = [IO.Path]::GetFullPath((Join-Path $portableOutput 'Zombie Killer.exe'))
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf) -or
              -not [string]::Equals($executable, [IO.Path]::GetFullPath([string]$build['executable']), [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Portable builder did not produce the expected EXE.'
          }
          $actualSha = (Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha -cne [string]$build['sha256'] -or
              (Get-Content -LiteralPath (Join-Path $portableOutput 'SHA256SUMS') -Raw).TrimEnd() -cne "$actualSha  Zombie Killer.exe") {
            throw 'Portable EXE does not match SHA256SUMS and builder output.'
          }
          $reportPath = Join-Path $env:RUNNER_TEMP 'zombie-portable-smoke.json'
          pwsh -NoProfile -File scripts/portable-smoke.ps1 -ExecutablePath $executable -ArchivePath $archive[0].FullName -ReportPath $reportPath -ExpectedPayloadSha256 $build['payload_sha256']
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json -AsHashtable
          if ($report['passed'] -ne $true -or $report['state_removed'] -ne $true -or
              $report['native_smoke'] -ne $true -or $report['concurrent_isolation'] -ne $true -or
              $report['payload_sha256_independently_supplied'] -ne $true -or
              $report['executable_sha256'] -cne $actualSha -or
              $report['diagnostic']['payload_sha256'] -cne $build['payload_sha256'] -or
              $report['diagnostic']['cleanup'] -ne $true) {
            throw 'Portable smoke report did not prove complete checked lifecycle.'
          }
          $runs = @($report['runs'])
          if ($runs.Count -ne 4) { throw 'Portable smoke report must include four controlled launches.' }
          foreach ($run in $runs) {
            if ($run['inventory_verified'] -ne $true -or $run['settled'] -ne $true) {
              throw 'Portable smoke report did not prove inventory and process settlement for every launch.'
            }
          }
      - name: Generate lock and sidecar file-inventory SBOMs
        run: pnpm sbom -- --output artifacts/sbom --sidecar-manifest apps/desktop/src-tauri/resources/engine/BUILD-MANIFEST.json
      - name: Upload unsigned verification artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-native-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/native/**
            artifacts/portable/Zombie Killer.exe
            artifacts/portable/SHA256SUMS
            artifacts/sbom/**
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
