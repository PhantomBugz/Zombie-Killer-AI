name: Secret scan

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "41 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan tracked tree and Git history
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Run value-suppressing scanner
        run: node scripts/secret-scan.mjs --tracked --history
      - name: Validate pinned Gitleaks directory negative control
        run: node scripts/test-gitleaks.mjs
