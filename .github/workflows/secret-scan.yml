name: Secret scan

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "41 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan tracked tree and Git history
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Run value-suppressing scanner
        run: node scripts/secret-scan.mjs --tracked --history
      - name: Validate pinned Gitleaks directory negative control
        run: node scripts/test-gitleaks.mjs
