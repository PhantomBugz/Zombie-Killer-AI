name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Use pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
      - name: Install exact JavaScript lock
        run: pnpm install --frozen-lockfile
      - name: Validate public repository
        run: |
          pnpm lint:docs
          pnpm test:docs
          pnpm test:workspace

  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
        python:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Use Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned uv
        run: python -m pip install uv==0.12.3
      - name: Sync exact Python lock
        run: uv sync --frozen
      - name: Diagnose new-directory ownership on private Windows runner
        if: github.event.repository.private && runner.os == 'Windows' && matrix.python == '3.12'
        shell: pwsh
        run: |
          $probe = & python -c "import tempfile; print(tempfile.mkdtemp(prefix='zk-owner-'))"
          if ($LASTEXITCODE -ne 0 -or -not $probe) { throw 'Owner probe could not create a directory.' }
          try {
            $tokenSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
            $ownerSid = (Get-Acl -LiteralPath $probe).GetOwner([System.Security.Principal.SecurityIdentifier]).Value
            Write-Output "token_user_sid=$tokenSid"
            Write-Output "new_directory_owner_sid=$ownerSid"
            Write-Output "sids_match=$($tokenSid -eq $ownerSid)"
          } finally {
            Remove-Item -LiteralPath $probe -Force
          }
      - name: Test engine, SDK, and release helpers
        run: uv run pytest services/engine/tests packages/sdk-python/tests packages/protocol/tests scripts/tests -q
      - name: Static Python checks
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        run: |
          uv run ruff check services/engine packages/sdk-python packages/protocol/tests scripts
          uv run mypy services/engine/src packages/sdk-python/src scripts/package-native-artifact.py scripts/collect-sidecar-legal.py scripts/python_package_artifacts.py scripts/tests
      - name: Build Python distributions
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        run: |
          uv build --package zombie-killer-engine --out-dir dist
          uv build --package zombie-killer-sdk --out-dir dist
          uv run python scripts/python_package_artifacts.py --dist dist

  frontend:
    name: Frontend on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Use pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
      - name: Install exact JavaScript lock
        run: pnpm install --frozen-lockfile
      - name: Lint, type-check, test, and build
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
