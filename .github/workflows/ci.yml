name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
      - name: Install exact JavaScript lock
        run: pnpm install --frozen-lockfile
      - name: Validate public repository
        run: |
          pnpm lint:docs
          pnpm test:docs
          pnpm test:workspace

  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
        python:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned uv
        run: python -m pip install uv==0.12.3
      - name: Sync exact Python lock
        run: uv sync --frozen
      - name: Test engine, SDK, and release helpers
        if: runner.os != 'Windows'
        run: uv run pytest services/engine/tests packages/sdk-python/tests packages/protocol/tests scripts/tests -q
      - name: Test engine, SDK, and release helpers on Windows
        if: runner.os == 'Windows'
        shell: pwsh -NoProfile -Command "python -I scripts/ci_windows_owner.py -- pwsh -NoProfile -File '{0}'; exit $LASTEXITCODE"
        run: |
          $ErrorActionPreference = 'Stop'
          uv run pytest services/engine/tests packages/sdk-python/tests packages/protocol/tests scripts/tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Static Python checks
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        run: |
          uv run ruff check services/engine packages/sdk-python packages/protocol/tests scripts
          uv run mypy scripts/package-native-artifact.py scripts/collect-sidecar-legal.py scripts/python_package_artifacts.py
      - name: Type-check Windows source and release tooling
        if: matrix.os == 'windows-2025' && matrix.python == '3.12'
        run: uv run mypy services/engine/src packages/sdk-python/src scripts/package-native-artifact.py scripts/collect-sidecar-legal.py scripts/python_package_artifacts.py scripts/tests
      - name: Build Python distributions
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        run: |
          uv build --package zombie-killer-engine --out-dir dist
          uv build --package zombie-killer-sdk --out-dir dist
          uv run python scripts/python_package_artifacts.py --dist dist

  macos-scan:
    name: macOS scanner unit tests (experimental)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned uv
        run: python -m pip install uv==0.12.3
      - name: Sync exact Python lock
        run: uv sync --frozen
      - name: Test read-only scanner
        run: uv run pytest services/engine/tests/test_scanner.py -q

  frontend:
    name: Frontend on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
      - name: Install exact JavaScript lock
        run: pnpm install --frozen-lockfile
      - name: Lint, type-check, test, and build
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
