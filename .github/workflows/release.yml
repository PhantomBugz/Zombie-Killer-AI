name: Release verification only

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type VERIFY_ONLY to build non-published evidence.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-source:
    name: Verify source and produce non-published evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Validate manual release confirmation
        shell: bash
        env:
          RELEASE_CONFIRMATION: ${{ inputs.confirm }}
        run: |
          if [ "$RELEASE_CONFIRMATION" != "VERIFY_ONLY" ]; then
            echo "::error::Manual confirmation must match the required verification-only phrase."
            exit 1
          fi
      - name: Check out complete source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Linux WebView prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Use pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Use Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Use pinned Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install exact dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          python -m pip install uv==0.12.3
          uv sync --frozen
          pnpm install --frozen-lockfile
      - name: Run release-candidate checks
        run: |
          pnpm verify
      - name: Generate source archive and SBOMs
        run: |
          mkdir -p artifacts/sbom
          git archive --format=tar.gz --prefix=Zombie-Killer-AI-0.1.0-alpha.1/ --output=artifacts/Zombie-Killer-AI-0.1.0-alpha.1-source.tar.gz HEAD
          pnpm sbom -- --output artifacts/sbom
          sha256sum artifacts/Zombie-Killer-AI-0.1.0-alpha.1-source.tar.gz artifacts/sbom/*.json > artifacts/SHA256SUMS
      - name: Upload verification evidence without publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verification-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
