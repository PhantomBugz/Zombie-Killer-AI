version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      javascript-production:
        dependency-type: production
      javascript-development:
        dependency-type: development

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri/build_support/unix-test-harness
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
