title = "Zombie Killer custom scanner allowlists"

# Only the local value-suppressing scanner consumes these exceptions. Every
# exception combines an exact test path with a synthetic marker or exact fixture.
[[allowlists]]
description = "Synthetic redaction fixtures only"
condition = "AND"
regexTarget = "match"
paths = [
  '''^(?:apps/desktop/src-tauri/src/engine_tests\.rs|apps/desktop/src/test/activity\.test\.tsx|packages/sdk-python/tests/test_lease\.py|scripts/test-public-repo\.mjs|services/engine/tests/test_protocol\.py|services/engine/tests/test_redaction\.py|services/engine/tests/test_scanner\.py)$''',
]
regexes = [
  '''(?:[Ss]ynthetic|[Ff]ixture|[Ee]xample|[Ff]ake|[Dd]ummy|[Hh]idden|[Hh]ush|do-not-return|nope|SUPERSECRET|EXAMPLE|REDACTED|two word secret)''',
]
