[package]
name = "zombie-killer-desktop"
version = "0.1.0-alpha.1"
description = "Local-first Agentic AI lifecycle console"
authors = ["PhantomBugz"]
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
homepage = "https://PhantomBugz.com"
repository = "https://github.com/PhantomBugz/Zombie-Killer-AI"
publish = false

[lib]
name = "zombie_killer_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "zombie-killer"
path = "src/main.rs"

[build-dependencies]
libc = "=0.2.191"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.1"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.1"
tauri = { version = "=2.11.6", default-features = false, features = ["wry"] }
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
tempfile = "3.22.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
